name: docs

on:
  # No path filter: a required docs check must report a verdict on every tip,
  # including one that changes no markdown.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required status-check context. Every step is a `./run.sh` arm, the same
  # command documented in docs/RUN_GUIDE.md, so CI holds no second copy of a check.
  markdown-link-check:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check links in markdown files
        run: ./run.sh links
      - name: Lint markdown files
        run: ./run.sh lint
      - name: Verify generated counts
        run: ./run.sh counts --check
      - name: Run the gate's regression tests
        run: ./run.sh test

  # GNN pin: .github/gnn-pin.json is the only place the pinned revision appears.
  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GNN_PYTHON_VERSION: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python with uv
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448 # AII standard 7159e67
        with:
          python-version: ${{ env.GNN_PYTHON_VERSION }}
          enable-cache: "false"
      # The arm bootstraps its own seeded interpreter, installs the pinned parser
      # revision in one pip pass, and prints the JSON receipt. The required
      # `markdown-link-check` job above is untouched and no check-run name changes.
      - name: Run the pinned GNN conformance arm
        run: ./run.sh gnn
