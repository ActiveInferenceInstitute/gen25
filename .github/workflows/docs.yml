name: docs

on:
  push:
    paths:
      - "**.md"
      - "**/*.md"
  pull_request:
    paths:
      - "**.md"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in markdown files
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
